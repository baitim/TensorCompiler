name: TensorCompiler pre-commit and post-push
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v5

      - name: Install LLVM/MLIR 21
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21 || true
          sudo apt-get update
          sudo apt-get install -y llvm-21 llvm-21-dev libmlir-21-dev mlir-21-tools

      - name: set common environment
        run: |
          uv sync --group dev
          source .venv/bin/activate
          echo "VIRTUAL_ENV=$(pwd)/.venv" >> "$GITHUB_ENV"
          echo "$(pwd)/.venv/bin" >> "$GITHUB_PATH"
      
      - name: setup conan
        run: |
          conan profile detect --force

      - name: CMake release config
        run: |
          conan install . --build=missing -s build_type=Release
          cmake --preset release -DMLIR_DIR=/usr/lib/llvm-21/lib/cmake/mlir \
                                 -DLLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm
          cmake --build build/Release

      - name: CMake release test
        run: ctest --test-dir build/Release --rerun-failed --output-on-failure

      - name: CMake debug config
        run: |
          conan install . --build=missing -s build_type=Debug
          cmake --preset debug -DMLIR_DIR=/usr/lib/llvm-21/lib/cmake/mlir \
                               -DLLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm
          cmake --build build/Debug

      - name: CMake debug test
        run: ctest --test-dir build/Debug --rerun-failed --output-on-failure


